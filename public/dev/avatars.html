<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0710">
  <meta name="robots" content="noindex">
  <title>Club Fortuna · Avatares</title>

  <!-- Web fonts are optional: every stack falls back to system fonts offline. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,700;0,800;1,500&display=swap">

  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/avatars.css">

  <style>
    /* Gallery-only layout. Everything is scoped under .avd. */
    .avd {
      display: grid;
      gap: var(--space-6);
      max-width: 76rem;
      margin: 0 auto;
      padding: var(--space-5) var(--space-4) 15rem;
    }

    .avd-hero {
      display: grid;
      gap: var(--space-2);
      justify-items: center;
      padding: var(--space-5) 0 0;
      text-align: center;
    }

    .avd-hero__lead {
      max-width: 44rem;
      color: var(--text-2);
    }

    .avd-section {
      min-width: 0;
    }

    .avd-row {
      display: grid;
      gap: var(--space-2);
      min-width: 0;
      margin-bottom: var(--space-5);
    }

    .avd-row:last-child {
      margin-bottom: 0;
    }

    .avd-label {
      color: var(--text-3);
      font-size: var(--fs-2xs);
      font-weight: 600;
      letter-spacing: var(--tracking-caps);
      text-transform: uppercase;
    }

    .avd-strip {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      gap: var(--space-3) var(--space-4);
      min-width: 0;
    }

    .avd-strip--wide {
      gap: var(--space-4) 3.25rem;
      padding-left: 2.5rem;
    }

    .avd-cell {
      display: grid;
      justify-items: center;
      gap: 0.375rem;
      min-width: 3.5rem;
    }

    .avd-cell__name {
      max-width: 6.5rem;
      color: var(--text-3);
      font-size: var(--fs-2xs);
      line-height: 1.2;
      text-align: center;
    }

    .avd-felt {
      padding: var(--space-4);
    }

    .avd-matrix {
      display: grid;
      grid-template-columns: 7rem repeat(var(--cols, 6), minmax(4rem, 1fr));
      align-items: end;
      gap: var(--space-3) var(--space-2);
      min-width: calc(7rem + var(--cols, 6) * 4.5rem);
    }

    /* avatarLab.show(): a magnifier over the page (click the backdrop to close) */
    .avd-lab {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: flex;
      flex-wrap: wrap;
      align-content: flex-start;
      align-items: flex-end;
      gap: 8px 26px;
      padding: 34px 44px;
      overflow: auto;
      background: #160e1d;
    }

    .avd-scroll {
      overflow-x: auto;
      padding: var(--space-2) 0 var(--space-2);
    }

    .avd-matrix__head {
      color: var(--gold-300);
      font-size: var(--fs-2xs);
      font-weight: 600;
      letter-spacing: var(--tracking-caps);
      text-align: center;
      text-transform: uppercase;
    }

    .avd-matrix__side {
      align-self: center;
      color: var(--text-2);
      font-size: var(--fs-sm);
      font-weight: 600;
    }

    .avd-matrix__cell {
      display: grid;
      justify-items: center;
    }

    .avd-controls {
      display: grid;
      gap: var(--space-3);
    }

    .avd-controls .avd-strip {
      align-items: center;
      gap: var(--space-2);
    }

    .avd-select {
      min-height: 2.125rem;
      padding: 0 0.75rem;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-sm);
      background-color: var(--ink-800);
      color: var(--text-1);
      font-size: var(--fs-sm);
    }

    .avd-log {
      min-height: 1.4em;
      overflow-wrap: anywhere;
      color: var(--text-3);
      font-size: var(--fs-sm);
    }

    .avd-modal {
      width: min(100%, 40rem);
      padding: 1rem 1.5rem 1.25rem;
      border: 1px solid var(--hairline-strong);
      border-radius: var(--radius-lg);
      background: var(--grad-surface), var(--surface-2);
      box-shadow: var(--shadow-3);
    }

    .avd-modal--phone {
      width: min(100%, 22.375rem);
      max-height: 34rem;
      overflow-y: auto;
    }

    .avd-editors {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      gap: var(--space-5);
    }

    /* The dock: mascot placeholder on the left, the lane fills the rest. */
    .avd-dock {
      position: fixed;
      right: 0;
      bottom: 0;
      left: 0;
      z-index: var(--z-sticky);
      display: flex;
      align-items: flex-end;
      padding-bottom: env(safe-area-inset-bottom, 0px);
      background: linear-gradient(180deg, rgba(11, 7, 16, 0) 0%, rgba(11, 7, 16, 0.9) 55%);
      pointer-events: none;
    }

    .avd-dock__mascot {
      display: grid;
      flex: none;
      place-items: end center;
      width: 130px;
      height: 96px;
      pointer-events: auto;
    }

    .avd-dealer {
      display: grid;
      place-items: center;
      width: 76px;
      height: 84px;
      border: 1px dashed var(--hairline-strong);
      border-radius: 40% 40% 12px 12px;
      background-color: rgba(212, 175, 90, 0.08);
      color: var(--gold-300);
      font-family: var(--font-display);
      font-size: var(--fs-2xs);
      font-style: italic;
      line-height: 1.2;
      text-align: center;
    }

    .avd-dealer.is-hit {
      animation: avd-flinch 420ms var(--ease-out);
    }

    @keyframes avd-flinch {
      30% {
        transform: translateX(-5px) rotate(-7deg);
      }

      60% {
        transform: translateX(3px) rotate(4deg);
      }
    }

    .avd-dock__lane {
      flex: 1 1 0%;
      min-width: 0;
    }

    @media (max-width: 480px) {
      .avd-dock__mascot {
        width: 74px;
      }

      .avd-dealer {
        width: 58px;
        height: 70px;
      }
    }
  </style>
</head>
<body>
  <main class="avd" id="avd">
    <noscript>Esta galería necesita JavaScript.</noscript>
  </main>
  <div class="avd-dock" id="avd-dock"></div>
  <script type="module" src="/dev/avatars.dev.js"></script>
</body>
</html>

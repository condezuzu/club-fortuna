<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0710">
  <meta name="robots" content="noindex">
  <title>Club Fortuna · Kit de componentes</title>

  <!-- Web fonts are optional: every stack falls back to system fonts offline. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,700;0,800;1,500&display=swap">

  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">

  <style>
    /* Gallery-only layout. Everything is scoped under .kit. */
    .kit {
      display: grid;
      gap: var(--space-6);
      max-width: 76rem;
      margin: 0 auto;
      padding: var(--space-5) var(--space-4) var(--space-8);
    }

    .kit-hero {
      position: relative;
      isolation: isolate;
      display: grid;
      justify-items: center;
      gap: var(--space-3);
      padding: var(--space-7) var(--space-4) var(--space-4);
      overflow: hidden;
      text-align: center;
    }

    .kit-hero__burst {
      position: absolute;
      bottom: 0;
      left: 50%;
      z-index: -1;
      width: min(64rem, 150%);
      height: 100%;
      transform: translateX(-50%);
    }

    .kit-hero__title {
      font-size: var(--fs-5xl);
    }

    .kit-hero__lead {
      max-width: 42rem;
      color: var(--text-2);
    }

    .kit-nav {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: var(--space-2);
    }

    .kit-section {
      scroll-margin-top: var(--space-4);
      min-width: 0;
    }

    .kit-demo {
      display: grid;
      gap: var(--space-2);
      min-width: 0;
      margin-bottom: var(--space-5);
    }

    .kit-demo:last-child {
      margin-bottom: 0;
    }

    .kit-demo__label {
      color: var(--text-3);
      font-size: var(--fs-2xs);
      font-weight: 600;
      letter-spacing: var(--tracking-caps);
      text-transform: uppercase;
    }

    .kit-demo__row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: var(--space-3) var(--space-4);
      min-width: 0;
    }

    .kit-demo__row--end {
      align-items: flex-end;
    }

    .kit-demo__row--top {
      align-items: flex-start;
    }

    .kit-felt {
      display: grid;
      gap: var(--space-5);
      min-width: 0;
      padding: var(--space-5);
    }

    .kit-felt .kit-demo__label {
      color: var(--felt-print);
    }

    .kit-cards {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-2);
    }

    .kit-stage {
      position: relative;
      display: grid;
      place-items: center;
      gap: var(--space-4);
      min-height: 15rem;
      padding: var(--space-5);
    }

    .kit-spots {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: var(--space-6);
    }

    .kit-spot {
      width: 6.5rem;
      height: 6.5rem;
      font-size: var(--fs-2xs);
    }

    /* chips sit on top of the printed caption */
    .kit-spot .chip-stack {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .kit-swatches {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-2);
    }

    .kit-swatch {
      width: 5.5rem;
    }

    .kit-swatch__color {
      height: 2.75rem;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-sm);
    }

    .kit-swatch__name {
      margin-top: 0.25rem;
      color: var(--text-3);
      font-family: ui-monospace, Menlo, Consolas, monospace;
      font-size: 0.625rem;
    }

    .kit-type {
      display: grid;
      gap: var(--space-3);
    }

    .kit-icons {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(5.75rem, 1fr));
      gap: var(--space-2);
    }

    .kit-icon {
      display: grid;
      justify-items: center;
      gap: 0.375rem;
      padding: 0.75rem 0.25rem;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      font-size: 1.25rem;
    }

    .kit-icon__name {
      color: var(--text-3);
      font-size: var(--fs-2xs);
    }

    .kit-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 19rem), 1fr));
      gap: var(--space-4);
      min-width: 0;
    }

    .kit-range {
      width: 14rem;
      max-width: 100%;
      accent-color: var(--gold-400);
    }

    .kit-big-number {
      font-size: var(--fs-3xl);
    }

    .kit-footer {
      display: grid;
      justify-items: center;
      gap: var(--space-3);
      text-align: center;
    }
  </style>
</head>
<body>
  <main class="kit" id="kit">
    <noscript>Esta galería necesita JavaScript.</noscript>
  </main>
  <script type="module" src="./kit.js"></script>
</body>
</html>

<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0710">
  <meta name="robots" content="noindex">
  <title>Club Fortuna · Don Fortunato</title>

  <!-- Web fonts are optional: every stack falls back to system fonts offline. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,700;0,800;1,500&display=swap">

  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/mascot.css">

  <style>
    /* Dev-page-only layout. The page code lives in /dev/mascot.dev.js (the server's
       CSP does not run inline scripts). */
    :root {
      --dev-bar-h: 3.5rem;
    }

    /* what the app shell does on phones */
    @media (max-width: 480px) {
      :root {
        --mascot-h: 96px;
      }
    }

    .dev {
      display: grid;
      gap: var(--space-4);
      max-width: 62rem;
      margin: 0 auto;
      padding: var(--space-4) var(--space-4) 22rem;
    }

    .dev__head {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: var(--space-2) var(--space-4);
    }

    .dev__title {
      font-size: var(--fs-2xl);
    }

    .dev__hint {
      color: var(--text-3);
      font-size: var(--fs-sm);
    }

    .dev__group {
      display: grid;
      gap: var(--space-2);
      padding: var(--space-3) var(--space-4) var(--space-4);
      border: 1px solid var(--hairline);
      border-radius: var(--radius-lg);
      background: var(--surface-glass);
    }

    .dev__row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: var(--space-2);
    }

    .dev__btn {
      padding: 0.4rem 0.75rem;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-pill);
      background: var(--ink-750);
      color: var(--text-1);
      font-size: var(--fs-sm);
      font-weight: 600;
      line-height: 1.2;
      transition: background var(--dur-1) ease, border-color var(--dur-1) ease, transform var(--dur-1) ease;
    }

    .dev__btn:hover {
      border-color: var(--hairline-strong);
      background: var(--ink-700);
    }

    .dev__btn:active {
      transform: translateY(1px);
    }

    .dev__btn--anim {
      border-color: var(--hairline-strong);
      color: var(--gold-200);
    }

    .dev__btn--hit {
      border-color: rgba(229, 89, 106, 0.5);
      color: var(--oxblood-200);
    }

    .dev__btn[aria-pressed="true"] {
      border-color: var(--gold-300);
      background: var(--gold-700);
      color: var(--gold-50);
    }

    .dev__check {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.3rem 0.6rem;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-pill);
      font-size: var(--fs-sm);
      cursor: pointer;
    }

    .dev__check input {
      accent-color: var(--gold-400);
    }

    .dev__input {
      min-width: 0;
      padding: 0.4rem 0.7rem;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-md);
      background: var(--ink-900);
      font-size: var(--fs-sm);
    }

    .dev__input--wide {
      flex: 1 1 14rem;
    }

    .dev__log {
      min-height: 1.4em;
      color: var(--text-2);
      font-size: var(--fs-sm);
    }

    /* the bottom bar, as the shell lays it out: fixed, the mascot at the left edge */
    .dev-floor {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: var(--z-hud);
      display: flex;
      align-items: flex-end;
      gap: var(--space-3);
      height: var(--dev-bar-h);
      padding: 0 var(--space-3) 0.35rem max(0.25rem, env(safe-area-inset-left));
      border-top: 1px solid var(--hairline-strong);
      background: linear-gradient(180deg, var(--ink-800) 0%, var(--ink-900) 100%);
      box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.45);
    }

    .dev-floor[data-bg="felt"] {
      background: linear-gradient(180deg, var(--felt-600) 0%, var(--felt-800) 100%);
    }

    .dev-floor[data-bg="ivory"] {
      background: var(--ivory-200);
    }

    .dev-floor__host {
      position: relative;
      z-index: 2;
    }

    .dev-floor__walker {
      display: grid;
      place-items: center;
      width: 2.25rem;
      height: 2.25rem;
      margin-bottom: 0.1rem;
      border: 2px solid rgba(255, 255, 255, 0.5);
      border-radius: 50%;
      color: #fffdf6;
      font-size: var(--fs-xs);
      font-weight: 700;
    }

    /* a backdrop strip behind him to judge his outline on other surfaces */
    .dev-wall {
      position: fixed;
      left: 0;
      bottom: var(--dev-bar-h);
      z-index: 1;
      width: min(26rem, 100%);
      height: 16rem;
      pointer-events: none;
      opacity: 0;
    }

    .dev-wall[data-bg="felt"] {
      opacity: 1;
      background: radial-gradient(ellipse at 30% 60%, var(--felt-500), var(--felt-800));
    }

    .dev-wall[data-bg="ivory"] {
      opacity: 1;
      background: var(--ivory-100);
    }
  </style>
</head>
<body>
  <main class="dev" id="dev">
    <noscript>Esta página necesita JavaScript.</noscript>
  </main>
  <div class="dev-wall" id="wall"></div>
  <div class="dev-floor" id="floor"></div>
  <script type="module" src="/dev/mascot.dev.js"></script>
</body>
</html>
